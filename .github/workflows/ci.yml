name: ci
on:
  push:
    branches: ["**"]   # not on tags: a nasdaq-v* tag runs these tests through build-nasdaq.yml
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e shared/mlkit -r pipelines/nasdaq/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test shared/mlkit
        working-directory: shared/mlkit
        run: pytest -q
      - name: Test pipelines/nasdaq
        working-directory: pipelines/nasdaq
        run: pytest -q
