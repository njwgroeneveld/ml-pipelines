name: build-nasdaq
# Build the Nasdaq pipeline image for the cluster (arm64) and push it to ghcr.io.
#     git tag nasdaq-v0.2.0 && git push origin nasdaq-v0.2.0   -> image tag 0.2.0
on:
  push:
    tags: ["nasdaq-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "image version, e.g. 0.2.1"
        required: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF_NAME#nasdaq-v}}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pipelines/nasdaq/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ml-pipelines-nasdaq:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ml-pipelines-nasdaq:${{ github.sha }}
