# Copy to values.local.yaml (git-ignored) and fill in. These are not secrets, but they
# identify your Supabase project, so they stay out of a public repo.
backendStore:
  postgres:
    host: aws-0-<REGION>.pooler.supabase.com     # Supabase: Connect -> Session pooler
extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: https://<PROJECT_REF>.storage.supabase.co/storage/v1/s3
  AWS_DEFAULT_REGION: <REGION>                   # e.g. eu-central-1
  # every address the UI is opened on, comma-separated
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://<node-ip>:30500,http://<vpn-ip>:30500"
# The UI is reached on <node-ip>:30500. Helm replaces lists, so repeat the in-cluster names.
serverAllowedHosts:
  - "mlflow.mlflow.svc.cluster.local:5000"
  - "mlflow.mlflow.svc:5000"
  - "mlflow.mlflow:5000"
  - "<node-ip>:30500"              # e.g. the LAN address of the node running MLflow
  - "<vpn-ip>:30500"               # optional: one line per Tailscale address
  - "localhost:*"
